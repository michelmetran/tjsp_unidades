name: Publish Python to PyPI

on: push

jobs:
  build-n-publish:
    name: Build and Publish Python UV 🐍 distributions 📦 to PyPI

    runs-on: ubuntu-latest

    # Permissão necessária para autenticação via OIDC no PyPI (Sem token fixo)
    permissions:
      id-token: write

    steps:
      # https://github.com/actions/checkout
      - name: Check out repository
        uses: actions/checkout@v4

      # https://github.com/astral-sh/setup-uv
      - name: Install uv
        uses: astral-sh/setup-uv@v5

      # https://github.com/actions/setup-python
      - name: Install uv & Set up Python
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"
          python-version: "3.11"
          enable-cache: true

      - name: Lock UV dependencies
        run: uv lock

      - name: Lock UV dependencies2
        run: uv lock

      - name: Install the project
        #run: uv sync --locked --all-extras --docs
        run: uv sync --locked

      - name: Build
        run: uv build

      - name: Publish
        run: uv publish
        #run: uv publish -t ${{ secrets.PYPI_TOKEN }}
