[project]
name = "tjsp_unidades"
version = "0.1.6"
description = "Obtem Unidades Administrativas do TJSP"
readme = "README.md"
requires-python = "~=3.12.0"
dependencies = [
    "lxml>=6.1.1",
    "notebook>=7.5.7",
    "open-geodata>=25.9.32",
    "openpyxl>=3.1.5",
    "pandas>=3.0.3",
    "python-dotenv>=1.2.2",
    "requests-ip-rotator>=1.0.18",
    "xlrd>=2.0.2",
]

[dependency-groups]
docs = [
    "mkdocs>=1.6.1",
    "mkdocs-jupyter>=0.26.3",
    "mkdocs-material[imaging]>=9.7.7",
]

#[tool.uv.package-data]
# Garante que arquivos .csv dentro da pasta 'data' do pacote sejam empacotados
#tjsp_unidades = ["data/*.csv", "data/**/*.csv", "data/**",]


[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# Informa ao Hatchling exatamente onde está o código do pacote
packages = ["tjsp_unidades"]
# Força a inclusão de todos os CSVs dentro da pasta data no wheel final
artifacts = ["**/data/*.csv", "**/data/**/*.csv"]


[project.urls]
Issues = "https://github.com/michelmetran/tjsp_unidades/issues/"
Documentation = "https://tjsp-unidades.readthedocs.io/pt/latest/"
Repository = "https://github.com/michelmetran/tjsp_unidades/"
Discussions = "https://github.com/michelmetran/tjsp_unidades/discussions"
